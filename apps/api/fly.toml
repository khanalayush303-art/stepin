# Fly.io app configuration for the StepIn API.
# Builds from the existing apps/api/Dockerfile — no separate build config needed.
app = 'stepin-api'
primary_region = 'syd'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  grace_period = '10s'
  interval = '15s'
  method = 'GET'
  timeout = '5s'
  path = '/health/live'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['app']

# Durable resume storage. Without this mount, resume files live on the machine's root filesystem and
# are lost on redeploy. Before deploying this change:
#   1. fly volumes create stepin_resumes --region syd --size 1 -a stepin-api
#   2. fly secrets set Storage__ResumeRootPath=/app/data/resumes -a stepin-api
# The volume must exist first, or the deploy fails. Keep one machine: a volume attaches to one machine only.
[[mounts]]
  source = 'stepin_resumes'
  destination = '/app/data'
