# Fly.io app configuration for the StepIn API.
# Builds from the existing apps/api/Dockerfile — no separate build config needed.
app = 'stepin-api'
primary_region = 'syd'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  grace_period = '10s'
  interval = '15s'
  method = 'GET'
  timeout = '5s'
  path = '/health/live'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['app']

# No [[mounts]] block: resume storage is Supabase (Storage__Provider=Supabase), not local disk —
# confirmed via DependencyInjection.AddResumeStorage's own branching (LocalDiskResumeStorage, the
# only code in the repo that ever reads Storage:ResumeRootPath or touches this path, is registered
# only when Storage:Provider != "Supabase") and the "Resume storage provider: {Provider}" line
# Program.cs now logs at startup. A volume attaches to exactly one machine, so this block required
# one stepin_resumes volume per machine in this process group — with two machines and only one
# volume ever created, every deploy failed with "needs volumes... to fulfill mounts" the moment
# Fly re-validated it. The stepin_resumes volume itself is untouched (not deleted) in case local
# disk is ever reactivated later; re-add this block (and provision one volume per machine) first
# if that ever happens.
