name: stepin

services:
  db:
    image: postgres:17-alpine
    container_name: stepin-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stepin}
      POSTGRES_USER: ${POSTGRES_USER:-stepin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stepin}
      # Deterministic collation so index ordering matches across machines.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-AU --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone returns true before the init scripts finish, so also
      # run a trivial query as the real user.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stepin} -d ${POSTGRES_DB:-stepin} && psql -U ${POSTGRES_USER:-stepin} -d ${POSTGRES_DB:-stepin} -c 'select 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: stepin-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=${POSTGRES_DB:-stepin};Username=${POSTGRES_USER:-stepin};Password=${POSTGRES_PASSWORD:-stepin}"
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:3000}
      # Clerk Frontend API domain — used for JWKS discovery only, not a secret.
      Clerk__Authority: ${CLERK_AUTHORITY:-}
      Clerk__AuthorizedParties__0: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "${API_PORT:-5080}:8080"
    healthcheck:
      # The aspnet runtime image has neither wget nor curl, and adding one
      # just for this would be an unnecessary dependency — bash (which the
      # image does have) can speak plain HTTP over its own /dev/tcp device.
      # CMD, not CMD-SHELL: CMD-SHELL wraps the string in /bin/sh, which on
      # this image is dash and doesn't understand /dev/tcp — bash must be the
      # process actually invoked, not just present on PATH.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5080}
        # Baked into the client bundle like NEXT_PUBLIC_API_BASE_URL — it's public by design.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        # Not public, but still needed at build time — see the Dockerfile comment:
        # the rewrites() destination is baked into .next's routes manifest at
        # build time, so this can't be a runtime-only `environment:` value.
        API_INTERNAL_BASE_URL: http://api:8080
    container_name: stepin-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Browser-side calls go to the host-published port, not the compose hostname.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5080}
      # Server-side calls stay on the compose network.
      API_INTERNAL_BASE_URL: http://api:8080
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      # Runtime-only — never a build arg, so it can never end up in the client bundle.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  db-data:
