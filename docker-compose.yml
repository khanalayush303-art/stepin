name: stepin

services:
  db:
    image: postgres:17-alpine
    container_name: stepin-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stepin}
      POSTGRES_USER: ${POSTGRES_USER:-stepin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stepin}
      # Deterministic collation so index ordering matches across machines.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-AU --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone returns true before the init scripts finish, so also
      # run a trivial query as the real user.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stepin} -d ${POSTGRES_DB:-stepin} && psql -U ${POSTGRES_USER:-stepin} -d ${POSTGRES_DB:-stepin} -c 'select 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: stepin-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=${POSTGRES_DB:-stepin};Username=${POSTGRES_USER:-stepin};Password=${POSTGRES_PASSWORD:-stepin}"
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:3000}
      # Real SMTP relay for verification/reset emails — any provider's relay works unchanged.
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__UseStartTls: ${SMTP_USE_STARTTLS:-true}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-no-reply@stepin.local}
      Smtp__FromName: ${SMTP_FROM_NAME:-StepIn}
      # Google OAuth is inert until both are set (see .env.example).
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      # Dev-only, opt-in local admin account. Never set these in a real deployment.
      Seed__DevAdmin__Enabled: ${DEV_ADMIN_ENABLED:-false}
      Seed__DevAdmin__Email: ${DEV_ADMIN_EMAIL:-}
      Seed__DevAdmin__Password: ${DEV_ADMIN_PASSWORD:-}
    ports:
      - "${API_PORT:-5080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5080}
    container_name: stepin-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Browser-side calls go to the host-published port, not the compose hostname.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5080}
      # Server-side calls stay on the compose network.
      API_INTERNAL_BASE_URL: http://api:8080
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  db-data:
